<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Si Labacin - Sistem Informasi Lapas Batulicin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <style>
        body { background-color: #D3D3D3; }
        .glass-card { background: #E1C16E; border: 1px solid #2d2d3a; }
        .swiper { width: 100%; height: 250px; }
        .swiper-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Perbaikan typo: object-fit bukan object-cover */
            opacity: 0.6;
        }
        /* Custom warna navigasi */
        .swiper-button-next, .swiper-button-prev {
            color: white !important;
            transform: scale(0.6); /* Mengecilkan ukuran panah agar pas di mobile */
        }
        .swiper-pagination-bullet { background: white !important; }
    </style>
</head>
<body class="text-white font-sans antialiased">

    <div class="max-w-md mx-auto min-h-screen pb-10 shadow-2xl bg-[#D3D3D3]">
        
        <div class="relative w-full overflow-hidden">
            <div class="swiper mySwiper">
                <div class="swiper-wrapper">
                    <div class="swiper-slide">
                        <img src="https://images.unsplash.com/photo-1499951360447-b19be8fe80f5?auto=format&fit=crop&w=800&q=80" alt="Slide 1">
                    </div>
                    <div class="swiper-slide">
                        <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=800&q=80" alt="Slide 2">
                    </div>
                    <div class="swiper-slide">
                        <img src="https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=800&q=80" alt="Slide 3">
                    </div>
                </div>
                
                <div class="swiper-button-next"></div>
                <div class="swiper-button-prev"></div>
                
                <div class="swiper-pagination"></div>
            </div>
        </div>

        <div class="relative flex flex-col items-center -mt-16 px-6 z-10">
            <div class="w-32 h-32 rounded-2xl border-4 border-[#0f0f13] overflow-hidden shadow-xl bg-blue-500">
                <img src="silabacin.png" alt="Profile" class="w-full h-full object-cover">
            </div>

            <div class="text-center mt-4">
                <h1 class="text-black text-3xl font-bold tracking-tight">SI LABACIN</h1>
                <p class="text-black text-m italic mt-3 leading-relaxed px-4">
                    Sistem Informasi Lapas Batulicin
                </p>
                <div class="flex items-center justify-center text-gray-500 text-xs mt-2">
                    <i class="fas fa-map-marker-alt mr-1"></i>
                    <span>Desa Saring, Sungai Bubu, Tanah Bumbu, Indonesia</span>
                </div>
            </div>

            <div class="flex space-x-4 mt-6">
                <a href="#" class="w-10 h-10 flex items-center justify-center rounded-full bg-white text-black hover:scale-110 transition"><i class="fab fa-facebook-f"></i></a>
                <a href="#" class="w-10 h-10 flex items-center justify-center rounded-full bg-white text-black hover:scale-110 transition"><i class="fab fa-youtube"></i></a>
                <a href="#" class="w-10 h-10 flex items-center justify-center rounded-full bg-white text-black hover:scale-110 transition"><i class="fab fa-instagram"></i></a>
                <a href="#" class="w-10 h-10 flex items-center justify-center rounded-full bg-white text-black hover:scale-110 transition"><i class="fab fa-tiktok"></i></a>
            </div>

            <hr class="w-full border-gray-800 my-8">

            <div class="w-full space-y-4">
                <a href="https://docs.google.com/forms/d/e/1FAIpQLSfKfq3IgogyUg2xBvY0gkixEvboWLXw5HOrrXrUjZpoStgzhw/viewform" class="flex items-center justify-between glass-card p-4 rounded-xl hover:bg-[#252530] transition">
                    <i class="fas fa-utility fa-semibold fa-link text-xl w-10 text-center"></i>
                    <span class="flex-1 text-center font-medium">Layanan Kunjungan</span>
                    <div class="w-10"></div>
                </a>
                <a href="https://lapasbatulicin.github.io/layanan-integrasi/" class="flex items-center justify-between glass-card p-4 rounded-xl hover:bg-[#252530] transition">
                    <i class="fas fas fa-utility fa-semibold fa-link text-xl w-10 text-center"></i>
                    <span class="flex-1 text-center font-medium">Layanan Integrasi (PB, CB, DAN CMB)</span>
                    <div class="w-10"></div>
                </a>
                <a href="https://lapasbatulicin.github.io/layanan-izin-luar-biasa/" class="flex items-center justify-between glass-card p-4 rounded-xl hover:bg-[#252530] transition">
                    <i class="fas fas fa-utility fa-semibold fa-link text-xl w-10 text-center"></i>
                    <span class="flex-1 text-center font-medium">Layanan Izin Luar Biasa</span>
                    <div class="w-10"></div>
                </a>
                <a href="#" class="flex items-center justify-between glass-card p-4 rounded-xl hover:bg-[#252530] transition">
                    <i class="fas fas fa-utility fa-semibold fa-link text-xl w-10 text-center"></i>
                    <span class="flex-1 text-center font-medium">Layanan Informasi Dan Pengaduan</span>
                    <div class="w-10"></div>
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        var swiper = new Swiper(".mySwiper", {
            loop: true,
            autoplay: {
                delay: 4000,
                disableOnInteraction: false, // Slideshow tetap lanjut meski sudah diklik manual
            },
            pagination: {
                el: ".swiper-pagination",
                clickable: true,
            },
            // Menambahkan fungsi tombol navigasi
            navigation: {
                nextEl: ".swiper-button-next",
                prevEl: ".swiper-button-prev",
            },
            effect: "slide", // Mengubah ke slide agar perpindahan manual lebih terasa "bergeser"
        });
    </script>
</body>
</html>
